services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: scoutnet2
      POSTGRES_PASSWORD: scoutnet2-dev-only
      POSTGRES_DB: scoutnet2
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoutnet2 -d scoutnet2"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Lokal Keycloak som efterliknar nya ScoutID (realm "scoutid", claimet scoutnet_member_no).
  # Endast för utveckling och demo. Testanvändare och lösenord finns i deploy/keycloak/README.md.
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.0
    command: ["start-dev", "--import-realm", "--http-port=8180", "--hostname=http://127.0.0.1:8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-dev-only
    ports:
      - "127.0.0.1:8180:8180"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro

volumes:
  pgdata:
