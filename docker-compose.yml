services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: scoutnet2
      POSTGRES_PASSWORD: scoutnet2-dev-only
      POSTGRES_DB: scoutnet2
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoutnet2 -d scoutnet2"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
